org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Base URL the app talks to. 10.0.2.2 is the special alias the Android
# emulator uses to reach "localhost" on the host machine running
# `npm start` inside ../api. Point this at a real host when you deploy
# the API somewhere reachable from a physical device.
QUICKGIG_API_BASE_URL=http://10.0.2.2:3000/
